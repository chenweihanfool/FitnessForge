services:
  app:
    build:
      context: .
      args:
        # Must match BASE_PATH below. Empty = app served at the domain root
        # (current VPS deployment at forge.weihanc.cloud). Set to /fitness
        # in .env for the old subpath setup behind Apache.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-}
    restart: unless-stopped
    environment:
      # Points at an existing Postgres instance (shared with tasktracker and
      # pf-cwh on this same host), not a container managed by this compose
      # file. If that Postgres runs directly on the Docker host (not itself
      # in a container), the host in this URL needs to be
      # host.docker.internal, not localhost/127.0.0.1 -- from inside the app
      # container, localhost means the container itself.
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_GOOGLE_EMAIL: ${ADMIN_GOOGLE_EMAIL}
      # Shared secret checked against the x-snapshot-secret header on the
      # weekly-radar-snapshot.yml GitHub Actions cron call -- must match that
      # workflow's SNAPSHOT_SECRET repo secret, or the endpoint always 401s.
      SNAPSHOT_SECRET: ${SNAPSHOT_SECRET}
      # Full external URL (including BASE_PATH, if any), used to build the
      # Google OAuth callback URL -- must exactly match an Authorized redirect
      # URI registered on the Google Cloud OAuth client.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://forge.weihanc.cloud}
      # Server-side counterpart of the build-time VITE_BASE_PATH above --
      # strips this prefix from incoming request paths (see server/index.ts).
      # Empty on the VPS (domain root); /fitness for the old Apache subpath.
      BASE_PATH: ${BASE_PATH:-}
      # Shared secret for the steps-auto-sync endpoint (steps-sync script)
      STEPS_SYNC_SECRET: ${STEPS_SYNC_SECRET}
      NODE_ENV: production
      PORT: "5000"
    # pgnet: shared network where the pg13 Postgres container lives, so
    # DATABASE_URL can use the pg13 hostname. It is external and must exist
    # before `docker compose up` (docker network create pgnet).
    networks:
      - pgnet
      - default
    ports:
      # Published on all interfaces because the reverse proxy (Caddy) runs in
      # a container and reaches the app via the host gateway (172.18.0.1), so
      # a 127.0.0.1-only bind would be unreachable. Set APP_BIND=127.0.0.1 if
      # the proxy runs directly on the host. 5138 avoids pf-cwh's 5137.
      - "${APP_BIND:-0.0.0.0}:5138:5000"

networks:
  pgnet:
    external: true
